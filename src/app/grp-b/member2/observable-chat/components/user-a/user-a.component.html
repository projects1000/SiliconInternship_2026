<div class="user-panel">
  <div class="panel-header">
    <div class="user-info">
      <img src="assets/rohan.jpg" alt="Rohan" class="profile-pic" onerror="this.src='assets/rohan.jpg'">
      <div>
        <h3>Rohan</h3>
        <span class="status">
          <span class="dot online"></span> Online
        </span>
      </div>
    </div>
  </div>

  <div class="panel-body">
    <textarea
      class="glass-input"
      rows="4"
      placeholder="Type a message..."
      [(ngModel)]="messageText"
      (keyup)="onTyping()"
      (keyup.enter)="sendMessage()"
    ></textarea>

    <div class="action-buttons">
      <button class="glass-button primary-emerald" (click)="sendMessage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        Send
      </button>

      <label class="glass-button file-upload-btn">
        <input type="file" (change)="onFileSelected($event)" hidden accept="image/*,.pdf,.doc,.docx,.txt">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
        </svg>
        File
      </label>
    </div>
  </div>
</div>
