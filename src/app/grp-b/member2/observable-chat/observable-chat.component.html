<div class="glass-app-container" [class.light-mode]="!isDarkMode">
  
  <div class="glass-circle circle-1"></div>
  <div class="glass-circle circle-2"></div>
  <div class="glass-circle circle-3"></div>

  <header class="app-header">
    <div class="header-left">
      <button class="back-btn" (click)="goBack()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Profile
      </button>
    </div>

    <div class="header-center">
      <h1>Chat Messenger</h1>
    </div>

    <div class="header-right">
      <div class="avatars">
        <img src="assets/rohan.jpg" alt="Rohan" class="avatar-mini rohan-avatar" onerror="this.src='assets/rohan.jpg'">
        <img src="assets/Gaurav.jpeg" alt="Gaurav" class="avatar-mini gaurav-avatar" onerror="this.src='assets/github.png'">
      </div>
      <button class="theme-toggle" (click)="toggleTheme()">
        <span *ngIf="isDarkMode">☀️ Light</span>
        <span *ngIf="!isDarkMode">🌙 Dark</span>
      </button>
    </div>
  </header>

  <main class="glass-main-layout">
    <!-- User A Panel -->
    <div class="panel-container user-a-container">
      <app-user-a></app-user-a>
    </div>

    <!-- Chat Window -->
    <div class="panel-container chat-window-container">
      <app-chat-window></app-chat-window>
    </div>

    <!-- User B Panel -->
    <div class="panel-container user-b-container">
      <app-user-b></app-user-b>
    </div>
  </main>

  <section class="bottom-section">
    <app-stats-dashboard></app-stats-dashboard>
  </section>

</div>
