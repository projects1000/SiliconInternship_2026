<div class="billing-page">

  <h1 class="page-title">
    🛒 Billing Management Store
  </h1>

  <div class="category-bar">

    <button
      class="category-btn"
      [class.active]="selectedCategory==='Cold Drink'"
      (click)="filter('Cold Drink')">

      🥤 Cold Drinks

    </button>

    <button
      class="category-btn"
      [class.active]="selectedCategory==='Energy Drink'"
      (click)="filter('Energy Drink')">

      ⚡ Energy Drinks

    </button>

    <button
      class="category-btn"
      [class.active]="selectedCategory==='Chocolate'"
      (click)="filter('Chocolate')">

      🍫 Chocolates

    </button>

    <button
      class="category-btn"
      [class.active]="selectedCategory==='Protein'"
      (click)="filter('Protein')">

      💪 Protein

    </button>

    <button
      class="category-btn"
      [class.active]="selectedCategory==='Veg'"
      (click)="filter('Veg')">

      🥗 Veg

    </button>

    <button
      class="category-btn"
      [class.active]="selectedCategory==='Non Veg'"
      (click)="filter('Non Veg')">

      🍗 Non Veg

    </button>

    <button
      class="category-btn"
      [class.active]="selectedCategory==='Zero Sugar'"
      (click)="filter('Zero Sugar')">

      🥤 Zero Sugar

    </button>

  </div>

  <div class="cart-top">
    🛒 Cart Items : {{cart.length}}
  </div>

  <div class="product-grid">

    <div
      class="product-card"
      *ngFor="let product of filteredProducts">

      <img
        [src]="product.image"
        [alt]="product.name">

      <div class="product-info">

        <h3>{{product.name}}</h3>

        <div class="price">
          ₹{{product.price}}
        </div>

        <span
          class="stock"
          [ngClass]="{
            'in-stock':product.stock,
            'out-stock':!product.stock
          }">

          {{product.stock ? '✅ In Stock' : '❌ Out Of Stock'}}

        </span>

        <br><br>

        <button
          *ngIf="product.stock"
          class="add-btn"
          (click)="addToCart(product)">

          Add To Cart

        </button>

        <button
          *ngIf="!product.stock"
          disabled
          class="disabled">

          Out Of Stock

        </button>

      </div>

    </div>

  </div>

  <div class="cart-section">

    <h2>
      🛒 Shopping Cart
    </h2>

    <div
      *ngIf="cart.length===0">

      No Products Added

    </div>

    <div
      class="cart-item"
      *ngFor="let item of cart">

      <span>
        {{item.name}}
      </span>

      <span>
        ₹{{item.price}}
      </span>

    </div>

    <div class="total">

      Total : ₹{{totalPrice}}

    </div>

    <button
      *ngIf="cart.length>0"
      class="checkout-btn">

      Proceed To Checkout

    </button>

  </div>

</div>
