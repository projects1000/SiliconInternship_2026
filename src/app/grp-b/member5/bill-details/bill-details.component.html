<div class="bill-box">

    <h2>Bill Details</h2>
  
    <table>
  
      <tr>
        <th>Product</th>
        <th>Price</th>
      </tr>
  
      <tr *ngFor="let item of cart">
        <td>{{item.name}}</td>
        <td>₹{{item.price}}</td>
      </tr>
  
    </table>
  
    <h3>Sub Total : ₹{{subtotal}}</h3>
    <h3>GST(18%) : ₹{{gst}}</h3>
    <h2>Total : ₹{{total}}</h2>
  
  </div>
