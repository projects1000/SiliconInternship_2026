<div class="cart-container">

  <!-- Top Bar -->
  <div class="cart-top-bar">
    <button class="back-btn" (click)="goBackToProducts()">
      ← Continue Shopping
    </button>
  </div>

  <div class="cart-header">
    <h1>🛒 Shopping Cart</h1>
    <p>Review your selected products before checkout</p>
  </div>

  <!-- Cart Items -->
  <div class="cart-items" *ngIf="ps.selectedProducts.length > 0">
    <div class="cart-item" *ngFor="let p of ps.selectedProducts; let i = index">
      <div class="product-info">
        <div class="product-icon">📦</div>
        <div>
          <h3>{{ p.name }}</h3>
          <span class="price">₹{{ p.price | number }}</span>
        </div>
      </div>
      <button class="remove-btn" (click)="ps.removeFromCart(i)">Remove</button>
    </div>
  </div>

  <!-- EMPTY CART - Clean & Centered (Amazon Style) -->
  <div *ngIf="ps.selectedProducts.length === 0" class="empty-cart">
    <div class="empty-content">
      <div class="empty-illustration">🛍️</div>
      <h2>Your cart is empty</h2>
      <p>Add some products to get started with your order</p>
      
      <!-- Single Beautiful Button -->
      <button class="start-shopping-btn" (click)="goBackToProducts()">
        Start Shopping
      </button>
    </div>
  </div>

  <!-- Summary (when items present) -->
  <div *ngIf="ps.selectedProducts.length > 0" class="summary-section">
    <div class="total-card">
      <h2>Total Amount</h2>
      <h1>₹{{ ps.getTotal() | number }}</h1>
      <button class="checkout-btn" (click)="checkout()">
        Proceed to Checkout →
      </button>
    </div>
  </div>

</div>
