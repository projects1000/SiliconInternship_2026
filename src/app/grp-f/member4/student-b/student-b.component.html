<!-- member4/student-b/student-b.component.html -->
<div class="chat-wrapper">
  <header class="chat-header">
    <div class="chat-user">
      <div class="avatar-box">👨</div>
      <div class="user-info">
        <h3>Kim</h3>
        <span class="status-text">🟢 Online</span>
      </div>
    </div>
  </header>
  
  <div class="messages-area">
    <div *ngFor="let msg of allMessages" 
         class="message"
         [class.sent]="msg.sender === 'Student B'"
         [class.received]="msg.sender === 'Student A'">
      <div class="message-content">
        <p>{{msg.text}}</p>
        <span class="message-time">
          {{msg.time}}
          <span *ngIf="msg.sender === 'Student B'">✓✓</span>
        </span>
      </div>
    </div>
    
    <div *ngIf="allMessages.length === 0" class="empty-state">
      <p>💬 Say hi to Aryi!</p>
    </div>
  </div>
  
  <div class="input-area">
    <input type="text" [(ngModel)]="message" (keyup.enter)="sendMessage()" 
      placeholder="Type a message..." class="message-input">
    <button class="send-btn" (click)="sendMessage()">➤</button>
  </div>
</div>
