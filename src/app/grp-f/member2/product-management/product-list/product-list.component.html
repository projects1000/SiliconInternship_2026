<div class="product-section">

  <h2>

    {{ selectedCategory }}

  </h2>

  <div class="product-grid">

    <div
      class="product-card"

      *ngFor="
      let product of
      products[selectedCategory]
      ">
      

      <img
      [src]="product.image"
      [alt]="product.name"
      title="{{ product.name }}">

      <div class="product-text">
        <h3>{{ product.name }}</h3>
        <p>{{ product.brand }}</p>
      </div>

      <div class="price">

        ₹ {{ product.price }}

      </div>
          <div class="qty-controls">

        <button
          type="button"
          (click)="decreaseQty(product)">
          -
        </button>

        <span>
          {{ product.quantity ?? 1 }}
        </span>

        <button
          type="button"
          (click)="increaseQty(product)">
          +
        </button>

      </div>

      <button class="cart-btn"
        (click)="addToCart(product)">
        Add To Cart

      </button>

    </div>

  </div>

</div>
