<!-- src/app/grp-f/member10/member10-chatapp/chat-window/chat-window.component.html -->

<div class="chat-window-wrapper">
  <div class="chat-header">
    <div class="chat-header-left">
      <div class="chat-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <div>
        <h3 class="chat-title">CHAT WINDOW COMPONENT</h3>
        <span class="chat-subtitle">Shared · Chat History</span>
      </div>
    </div>
    <button class="clear-btn" (click)="clearChat()" title="Clear Chat">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14H6L5 6"/>
        <path d="M10 11v6M14 11v6"/>
        <path d="M9 6V4h6v2"/>
      </svg>
      Clear Chat
    </button>
  </div>

  <div class="chat-body" #chatBody>
    <div *ngIf="messages.length === 0" class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>No messages yet. Start chatting!</p>
    </div>

    <div
      *ngFor="let msg of messages"
      class="message-row"
      [class.row-gents]="msg.sender === 'Anisha'"
      [class.row-mayur]="msg.sender === 'Mayur'"
    >
      <div *ngIf="msg.sender === 'Gents'" class="msg-avatar avatar-gents">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </div>

      <div class="bubble-wrap"
           [class.wrap-gents]="msg.sender === 'Anisha'"
           [class.wrap-mayur]="msg.sender === 'Mayur'">
        <span class="sender-label">{{ msg.sender }}</span>
        <div class="bubble"
             [class.bubble-gents]="msg.sender === 'Gents'"
             [class.bubble-mayur]="msg.sender === 'Mayur'">
          {{ msg.text }}
          <span class="time-stamp">{{ formatTime(msg.timestamp) }} ✔✔</span>
        </div>
      </div>

      <div *ngIf="msg.sender === 'Mayur'" class="msg-avatar avatar-mayur">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="chat-footer">
    <span class="footer-stat"><strong>Total Messages : {{ messages.length }}</strong></span>
    <span class="footer-divider">|</span>
    <span class="footer-stat"><strong>Last Message : </strong> {{ lastMessage }}</span>
  </div>
</div>
