<div class="user-panel panel-gents">

  <!-- ── Header ──────────────────────────────────────────── -->
  <div class="user-header">
    <div class="user-avatar avatar-gents">G</div>
    <div class="user-meta">
      <h3 class="user-name">Gents</h3>
      <div class="online-row">
        <span class="pulse-dot dot-green"></span>
        <span class="online-label">Online</span>
      </div>
    </div>
    <span class="user-tag">User A</span>
  </div>

  <!-- ── RxJS Hint ────────────────────────────────────────── -->
  <div class="rxjs-hint hint-gents">
    <span class="hint-icon">⚡</span>
    <span class="hint-text">Uses <code>Subject.next()</code> to send messages</span>
  </div>

  <!-- ── Message Input ────────────────────────────────────── -->
  <div class="input-section">
    <label class="input-label" for="gents-msg">Enter Message</label>
    <textarea
      id="gents-msg"
      class="msg-textarea"
      [(ngModel)]="messageText"
      (input)="onInput()"
      (keydown)="onKeydown($event)"
      placeholder="Type a message to Mayur..."
      rows="4"
    ></textarea>
  </div>

  <!-- ── Send Button ───────────────────────────────────────── -->
  <button
    id="gents-send-btn"
    class="send-btn send-btn-gents"
    [class.sending]="isSending"
    (click)="send()"
  >
    <span class="send-icon">{{ isSending ? '✓' : '✈' }}</span>
    <span>{{ isSending ? 'Sent!' : 'SEND' }}</span>
  </button>

  <!-- ── Footer ───────────────────────────────────────────── -->
  <div class="user-footer">
    <span class="logged-label">Logged in as: </span>
    <strong class="logged-name logged-gents">Gents</strong>
  </div>

</div>
